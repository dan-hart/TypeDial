    #typedial-playground {
      --surface: light-dark(#fffefa,#222322);
      --ink: light-dark(#232520,#f3f2eb);
      --quiet: light-dark(#535850,#b7b9ad);
      --border: light-dark(#d0d2c7,#505249);
      --selected: light-dark(#e3e8dc,#3d463b);
      --alert: light-dark(#8b3319,#ffb6a2);
      --accent: #ff6600;
      color:var(--ink); font: 14px/1.4 system-ui,sans-serif;
    }
    #typedial-playground * { box-sizing:border-box; }
    #typedial-playground [hidden] { display:none!important; }
    #typedial-playground h1, #typedial-playground h2, #typedial-playground h3, #typedial-playground p { margin:0; }
    #typedial-playground h1, #typedial-playground h2 { font-size:22px; letter-spacing:-.035em; }
    #typedial-playground h3 { font-size:15px; }
    #typedial-playground .quiet { color:var(--quiet); font-size:12px; }
    #typedial-playground button, #typedial-playground select {
      font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--border);
      border-radius:8px; min-height:36px; padding:5px 8px; min-width:0;
    }
    #typedial-playground button[aria-pressed="true"] { background:var(--selected); border-color:var(--accent); }
    #typedial-playground input[type="range"] { width:100%; accent-color:var(--quiet); }
    #typedial-playground input[type="checkbox"] { accent-color:var(--quiet); width:17px; height:17px; }
    #typedial-playground .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    #typedial-playground .split { display:flex; gap:10px; align-items:center; justify-content:space-between; }
    #typedial-playground .wide { display:grid; grid-template-columns:minmax(0,1.08fr) minmax(300px,1fr); gap:14px; }
    #typedial-playground .stage {
      display:flex; flex-direction:column; gap:14px; padding:18px; border-radius:16px; min-width:0;
      background:light-dark(#ecece4,#2b2d27);
    }
    #typedial-playground .screen-row { display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:13px; }
    #typedial-playground figure { margin:0; text-align:center; min-width:0; }
    #typedial-playground figcaption { margin-top:7px; font-weight:600; }
    #typedial-playground .case {
      display:inline-flex; align-items:center; justify-content:center; max-width:100%;
      padding:7px; border-radius:15px; background:#262823; border:1px solid #62655a;
      box-shadow:0px 4px 8px #0002, inset 0 0 0 2px #ffffff0d;
    }
    #typedial-playground .case.round { border-radius:50%; }
    #typedial-playground canvas { display:block; width:100%; height:auto; max-width:100%; }
    #typedial-playground .round canvas { border-radius:50%; }
    #typedial-playground .hero .case { width:min(100%,210px); }
    #typedial-playground .hero > .screen-row { grid-template-columns:repeat(3,minmax(0,1fr)); }
    #typedial-playground .vignettes { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:auto; }
    #typedial-playground .hero .vignettes .case { width:min(100%,86px); padding:4px; }
    #typedial-playground .vignettes figcaption { font-size:12px; font-weight:500; }
    #typedial-playground .settings {
      display:grid; gap:11px; align-content:start; background:var(--surface); border:1px solid var(--border);
      border-radius:16px; padding:16px; min-width:0;
    }
    #typedial-playground .pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    #typedial-playground .field { display:grid; gap:3px; min-width:0; }
    #typedial-playground .fonts button { flex:1 1 54px; display:grid; gap:1px; justify-items:center; }
    #typedial-playground .sample { font-size:22px; line-height:1.05; }
    #typedial-playground hr { border:0; border-top:1px solid var(--border); margin:0; }
    #typedial-playground output { font-variant-numeric:tabular-nums; }
    #typedial-playground .contrast { min-height:18px; }
    #typedial-playground .contrast.problem { color:var(--alert); }
    #typedial-playground .swatch { display:inline-block; width:12px; height:12px; border-radius:50%; border:1px solid var(--quiet); }
    #typedial-playground .color-field { position:relative; }
    #typedial-playground .color-field select { width:100%; padding-inline-start:26px; }
    #typedial-playground .color-field .swatch { position:absolute; inset-inline-start:8px; inset-block-end:12px; pointer-events:none; }
    #typedial-playground .swatch-picker summary { min-height:32px; align-content:center; cursor:pointer; }
    #typedial-playground .swatch-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:5px; margin-top:6px; }
    #typedial-playground .swatch-grid button { display:flex; align-items:center; gap:6px; text-align:start; font-size:12px; }
    #typedial-playground .swatch-grid .swatch { flex:0 0 16px; width:16px; height:16px; }
    #typedial-playground .swatch-group { margin-top:8px; }
    #typedial-playground .palette-group { display:grid; gap:5px; }
    #typedial-playground .palette { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(126px,100%),1fr)); gap:5px; }
    #typedial-playground .palette button { display:flex; align-items:center; justify-content:space-between; gap:5px; text-align:start; }
    #typedial-playground .palette-sample { display:inline-flex; align-items:center; gap:3px; flex-shrink:0; }
    #typedial-playground .palette-sample .swatch { width:10px; height:10px; }
    #typedial-playground .portfolio { margin-top:18px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; }
    #typedial-playground .gallery { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr)); gap:12px; margin-top:12px; }
    #typedial-playground .model { display:grid; gap:7px; text-align:center; border-radius:12px; padding:10px 8px 8px; background:light-dark(#efefe8,#2b2d27); }
    #typedial-playground .model .screen-row { gap:6px; }
    #typedial-playground .model .case { width:min(100%,92px); padding:4px; border-radius:10px; }
    #typedial-playground .model .case.round { border-radius:50%; }
    #typedial-playground .model figcaption { font-size:12px; font-weight:500; font-variant-numeric:tabular-nums; }
    #typedial-playground .case canvas { width:100% !important; height:auto; image-rendering:pixelated; }
    @media(max-width:665px) {
      #typedial-playground .wide { grid-template-columns:minmax(0,1fr); }
    }
    @media(pointer:coarse) {
      #typedial-playground button, #typedial-playground select { min-height:44px; }
    }
